name: daily-news-digest
on:
  schedule:
    # 한국시간 월~금 00:10 (= UTC 일~목 15:10). 요일 숫자는 UTC 기준이라 KST보다 하루 이르다.
    # GitHub Actions의 schedule 트리거는 "최선 노력"일 뿐 정확한 시각을 보장하지 않고,
    # 이 저장소는 실제로 3.5~6시간씩 늦게 실행되는 경우가 잦았다(예: 08:10 예약 → 13시
    # 넘어서 실행). "반드시 07시 KST 이전 발송"을 맞추기 위해 지연분을 감안해 06~07시
    # KST보다 훨씬 이른 00:10 KST로 예약해둔다(지연이 거의 없는 날엔 새벽에 일찍 올 수
    # 있다는 뜻이다).
    # 공휴일은 크론으로 거를 수 없어 news_digest.py 안에서 별도로 확인해 건너뛴다.
    - cron: '10 15 * * 0-4'
  workflow_dispatch:
    inputs:
      force_send:
        description: '주말/공휴일이어도 강제로 발송 (테스트용)'
        type: boolean
        default: false
      mail_to_override:
        description: '이번 실행만 이 주소로 발송 (비워두면 NEWS_MAIL_TO 그대로 사용)'
        type: string
        default: ''
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-news.txt
      - run: python news_digest.py
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NEWS_MAIL_TO: ${{ secrets.NEWS_MAIL_TO }}
          MAIL_TO_OVERRIDE: ${{ inputs.mail_to_override }}
          FORCE_SEND: ${{ inputs.force_send }}
